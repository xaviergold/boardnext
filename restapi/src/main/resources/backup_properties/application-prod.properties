#Redis 설정
#Lettuce(레터스)는 Java 환경에서 가장 널리 사용되는 고성능 오픈소스 Redis 클라이언트 라이브러리로
#스프링 부트 백엔드가 Redis(세션 저장소)에 데이터를 쓰고 읽을 때, 뒷단에서 가장 빠르고 안정적으로 
#네트워크 통신을 전담해 주는 엔진
spring.data.redis.host=redis-service
spring.data.redis.port=6379
spring.data.redis.password=12345
# Lettuce가 Redis 명령을 보내고 응답을 기다리는 최대 시간 (2초 넘으면 에러)
spring.data.redis.timeout=2s
# Lettuce가 Redis 서버와 처음 연결을 맺을 때 기다리는 최대 시간
spring.data.redis.connect-timeout=2s
# 애플리케이션이 종료될 때 Lettuce가 안전하게 연결을 닫고 자원을 정리하는 대기 시간
spring.data.redis.lettuce.shutdown-timeout=500ms
# 스프링 부트 3.x 세션 저장소 타겟 지정 (store-type 대치)
spring.session.redis.repository-type=default
# 세션 만료 시간 설정 (3.x 표준 Duration 표기법)
spring.session.timeout=12h
# 세션 플러시 모드 설정 : 요청이 끝날 때까지 기다리지 않고 Redis에 바로 반영되도록 함 (간헐적 누락 방지)
spring.session.redis.flush-mode=immediate


