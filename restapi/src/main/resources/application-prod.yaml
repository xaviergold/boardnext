# =============================================
# Redis 및 스프링 세션 설정
# =============================================
spring:
  data:
    redis:
      host: redis-service
      port: 6379
      password: 12345
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        shutdown-timeout: 500ms

  session:
    timeout: 12h
    redis:
      repository-type: default
      flush-mode: immediate

  #kafka
  kafka:
    bootstrap-servers: kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092  

  # =============================================
  # OAuth2 클라이언트 설정 (Google, Naver)
  # =============================================
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 711523001885-juqcv9l9a68vuln6fljl3on38hs6n9a7.apps.googleusercontent.com
            client-secret: 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
            scope: email
          google-secretary:
            client-id: 984305192564-rf37pelan1c86dca4e6e339jktlnd0u3.apps.googleusercontent.com
            client-secret: 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
            provider: google
            scope:
              - email
              - https://mail.google.com/
              - https://www.googleapis.com/auth/calendar
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic
          naver:
            client-id: cgVQhyidNbW9KzRtyT_G
            client-secret: hACwVsfU4M
            redirect-uri: https://www.boardnext.com/login/oauth2/code/naver
            scope: email
            client-name: naver
            authorization-grant-type: authorization_code
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

  # =============================================
  # MCP Client 설정 (프로덕션 환경)
  # 클러스터 내부 서비스명으로 직접 연결 (Ingress 불필요, 더 효율적)
  # =============================================
  ai:
    mcp:
      client:
        enabled: true
        toolcallback:
          enabled: true
        servers:
          boardnext-local:
            url: http://boardrest-service:8080/mcp
            transport-type: HTTP

# =============================================
# PostgreSQL (PGVector 전용 DataSource)
# =============================================
pgvector:
  datasource:
    jdbc-url: jdbc:postgresql://pgvector-service:5432/vectordb
    username: postgres
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      pool-name: PgVectorPool
# =============================================
# WebSocket URL 설정
# =============================================     
seat:
  chat-ws-url: ws://chat-service:4000      