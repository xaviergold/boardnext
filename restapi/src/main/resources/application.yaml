spring:
  profiles:
    active: local
  #자바 메일 사용 - 구글 계정 설정  
  mail:
    host: smtp.gmail.com
    port: 587
    username: khw8017@gmail.com
    password: ${EMAIL_PW}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true  
  
  application:
    name: Boardnext
  datasource:
    # Hibernate 메타 조회용 (표준 경로) - Oracle 메인 DB
    url: ${DBMS_URL}
    driver-class-name: ${DBMS_DRIVER}
    username: ${DBMS_USERNAME}
    password: ${DBMS_PW}
    # HikariCP 전용 설정
    hikari:
      jdbc-url: ${DBMS_URL}
      driver-class-name: ${DBMS_DRIVER}
      username: ${DBMS_USERNAME}
      password: ${DBMS_PW}
      connection-test-query: SELECT sysdate FROM DUAL
      maximum-pool-size: 10
      minimum-idle: 2

  # JPA 설정
  jpa:
    database: oracle
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  # 파일 업로드 설정
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB

  # JSON 설정
  # JPA 엔티티를 직접 JSON으로 반환하다가 발생하는 프록시 객체 직렬화 에러나, 
  # 공공 API 통신/오브젝트 매핑 과정에서 속성이 비어 있는 객체 때문에 
  # 전체 로직이 망가지는 현상을 막기 위한 예방 조치(방어적 코드)로 false를 사용.
  # 즉, 비어 있는 객체(Bean)를 JSON으로 바꿀 때, 에러 내지 말고 
  # 그냥 빈 JSON {}으로 만들어줘"라고 잭슨(Jackson) 라이브러리에게 명령하는 것
  jackson:
    serialization:
      fail-on-empty-beans: false

  # OpenAI API 설정
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-5.4-mini    
          #model: gpt-5-mini
          #temperature: 1.0
    # PGVector 설정
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536          # text-embedding-ada-002 / text-embedding-3-small 기본값
        initialize-schema: true   # 최초 실행 시 vector_store 테이블 자동 생성

    # ─────────────────────────────────────────────────────────
    # MCP Server 설정 (BoardRest가 MCP 서버 역할을 겸함)
    # Streamable HTTP 프로토콜로 /mcp 엔드포인트 노출
    # MCP Client URL은 프로파일별 yaml에서 설정
    #   dev   → application-dev.yaml   : http://localhost:8080/mcp
    #   local → application-local.yaml : https://www.boardnext.com/mcp
    #   prod  → application-prod.yaml  : http://boardrest-service:8080/mcp
    # ─────────────────────────────────────────────────────────
    mcp:
      server:
        enabled: true
        name: boardnext-mcp-server
        version: 1.0.0
        protocol: STREAMABLE       # Streamable HTTP (SSE 후속, 프로덕션 표준)
        type: SYNC                 # 동기 방식
  
  # Kafka 설정
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        acks: all
    consumer:
      group-id: boardnext-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

