# =============================================
# 톰캣 및 HTTP 커넥터 설정
# =============================================
server:
  tomcat:
    # HTTP 커넥터 파트 개수 제한
    # 스프링부트 3.5.1부터 적용된 보안 취약점 Patch로 인해 multipart/form-data 요청에 포함될 수 있는 최대 파트 수(maxPartCount)가 기본값 10개로 제한
    # 즉, 전송된 폼 필드와 파일의 총합이 10개를 초과하면 org.apache.tomcat.util.http.fileupload.impl.FileCountLimitExceededException 에러 발생
    # multipart/form-data 요청에서 업로드 가능한 파트(part)의 최대 개수
    max-part-count: 100
    # HTTP 요청 파라미터의 최대 개수. HTTP 요청 파라미터는 브라우저가 서버에 보내는 이름=값(name=value) 형태의 데이터
    max-parameter-count: 10000
    
# =============================================
# 프로메테우스 및 액추에이터 설정
# =============================================
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
      cors:
        allowed-origins: 
          - http://localhost:3000
          - http://www.boardreact.com
          - https://www.boardreact.com
          - http://www.boardnext.com
          - https://www.boardnext.com
          - http://www.boardnuxt.com
        allowed-methods: GET,POST
        allowed-headers: "*"
        
  endpoint:
    health:
      show-details: always
      
  info:
    defaults:
      enabled: true
    build:
      enabled: true
    env:
      enabled: true
    java:
      enabled: true
      
  metrics:
    tags:
      application: boardrest    

