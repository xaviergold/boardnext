apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apache
  template:
    metadata:
      name: apache
      labels:
        app: apache
    spec:
      containers:
      - name: apache
        image: docker.io/huahua10ve/apache_boardnext:{{VERSION}}
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        volumeMounts:
        - name: apache-vhosts-volume
          mountPath: /usr/local/apache2/conf/extra/httpd-vhosts.conf #덮어쓸 경로
          subPath: httpd-vhosts.conf # ConfigMap에서 가져올 특정 키(파일명)
      imagePullSecrets:
      - name: docker-secret
      volumes:
      - name: apache-vhosts-volume
        configMap:
          name: boardnext-config  #configMap의 metadata name 

---
apiVersion: v1
kind: Service
metadata:
  name: apache-service
spec:
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30004
  selector:
    app: apache
  type: NodePort
