apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-deployment
spec:
  #replicas: 1
  strategy:   #배포전략 - Rolling
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%   #업데이트 중 추가로 띄울 수 있는 최대 파드 비율
      maxUnavailable: 25%  #업데이트 중 동시에 다운될 수 있는 최대 파드 비율
  selector:
    matchLabels:
      app: apache
  template:
    metadata:
      name: apache
      labels:
        app: apache
    spec:
      containers:
      - name: apache
        image: docker.io/redleon1/apache-boardnext:{{VERSION}}
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        # HPA를 위한 리소스 요청량 추가
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
      imagePullSecrets:
      - name: docker-secret

---
apiVersion: v1
kind: Service
metadata:
  name: apache-service
spec:
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30004
  selector:
    app: apache
  type: NodePort

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apache-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apache-deployment
  minReplicas: 1
  maxReplicas: 1
  metrics:
  #1. Metrics Server를 바라보는 기본 설정 (CPU가 70%를 넘으면 늘려라!)  
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  #2. Prometheus를 바라보는 커스텀 설정 (초당 요청이 100건을 넘으면 늘려라!)
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: 100
