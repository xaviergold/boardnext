# =============================================
# PGVector Secret (default namespace)
# echo -n "12345" | base64 → MTIzNDU=
# =============================================
apiVersion: v1
kind: Secret
metadata:
  name: pgvector-secret
type: Opaque
data:
  POSTGRES_PASSWORD: MTIzNDU=   # "12345" base64 인코딩값
