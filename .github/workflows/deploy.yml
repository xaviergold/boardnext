name: boardnext CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-deploy:
    runs-on: self-hosted 

    steps:
      # 1. 소스코드 가져오기
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Java 환경 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Compile & Build 
      - name: Grant execute permission for gradlew
        run: chmod +x ./restapi/gradlew

      - name: Compile and Build
        run: |
          cd restapi
          ./gradlew clean build -x test
          cd ..
          cp ./restapi/build/libs/BoardRest-0.0.1-SNAPSHOT.jar ./docker/boardrest/boardrest.jar
          ls -lah ./docker/boardrest/

      # 4. Docker Login
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USR }}
          password: ${{ secrets.DOCKERHUB_PSW }}

      # 5. Docker Image Build & Push 
      - name: Build and Push Docker Images
        run: |
          # Build 
          docker build --no-cache -t redleon1/apache-boardnext:${{ github.run_number }} ./docker/apache2/
          docker build --no-cache -t redleon1/boardrest-boardnext:${{ github.run_number }} ./docker/boardrest/
          
          # Push
          docker push redleon1/apache-boardnext:${{ github.run_number }}
          docker push redleon1/boardrest-boardnext:${{ github.run_number }}
          
          # Clean up (self-hosted 서버 용량 관리)
          docker image rm redleon1/apache-boardnext:${{ github.run_number }}
          docker image rm redleon1/boardrest-boardnext:${{ github.run_number }}

      # 6. Kubernetes Deploy & Ingress IP 추출 (💡 오직 Apache와 BoardRest만 배포)
      - name: Deploy to Kubernetes
        run: |
          sed -i 's/{{VERSION}}/${{ github.run_number }}/g' ./kubernetes/apache2.yml
          sed -i 's/{{VERSION}}/${{ github.run_number }}/g' ./kubernetes/boardrest.yml
          
          kubectl apply -f ./kubernetes/boardrest.yml
          kubectl apply -f ./kubernetes/apache2.yml
          kubectl apply -f ./kubernetes/ingress.yml
          
          # 인그레스 IP 추출 및 GITHUB_ENV 전역 변수 등록
          INGRESS_IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "INGRESS_IP=$INGRESS_IP" >> $GITHUB_ENV
          
          echo "========================================="
          echo "배포 완료! Ingress IP: $INGRESS_IP"
          echo "========================================="

      # 7. Slack 알림 (성공 시)
      - name: Slack Notification (Success)
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "channel": "#it교육",
              "attachments": [
                {
                  "color": "#2C953C",
                  "text": "✅ boardnext 배포가 성공하였습니다. (접속 IP: ${{ env.INGRESS_IP }})"
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      # 8. Slack 알림 (실패 시)
      - name: Slack Notification (Failure)
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "channel": "#it교육",
              "attachments": [
                {
                  "color": "#FF3232",
                  "text": "❌ boardnext 배포가 실패하였습니다."
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
